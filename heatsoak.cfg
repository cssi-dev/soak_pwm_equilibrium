# =============================================================================
# heatsoak.cfg  --  Bed heat-soak monitor for Klipper
# =============================================================================
#
# WHAT IT DOES
#   Continuously samples the bed thermistor temperature and the heater PWM
#   duty cycle (printer.heater_bed.power, 0.0..1.0) into a rolling buffer and
#   reports a 5-minute average. A steady, low PWM at target temperature is a
#   good proxy for a fully saturated (soaked) build plate.
#
# 5-MINUTE WINDOW
#   Samples are taken every SAMPLE_PERIOD seconds. WINDOW_SECONDS / SAMPLE_PERIOD
#   samples make up the 5-minute window (default 5s -> 60 samples).
#
# SURVIVING A REBOOT
#   Macro variables live in RAM and are lost on restart. To "include the time
#   before the shutdown", the buffer is persisted to disk via [save_variables]
#   on every sample. On startup the saved buffer is reloaded ONLY IF the gap
#   since the last save is short (STALE_AFTER_SECONDS) -- i.e. the printer was
#   only briefly down and the bed is likely still warm. If the printer was off
#   long enough to cool, the stale history is discarded and we start fresh.
#
#   Requires (add to printer.cfg if not already present):
#       [save_variables]
#       filename: ~/printer_data/config/variables.cfg
#
# USAGE
#   SOAK_MONITOR_START     - begin sampling (auto-started on boot, see below)
#   SOAK_MONITOR_STOP      - stop sampling (call from cleanup / CANCEL_PRINT)
#   SOAK_STATUS            - print current 5-min avg temp + avg/early/late PWM
#   QUERY_BED_PWM          - one-shot: current bed PWM and temperature
# =============================================================================


# --------------------------------------------------------------------------
# Tunables + rolling buffer state
# --------------------------------------------------------------------------
[gcode_macro SOAK_MONITOR]
# --- config ---
variable_sample_period: 5           # seconds between samples
variable_window_seconds: 300        # 5 minutes
variable_stale_after_seconds: 120   # discard restored history if boot gap > this
# --- runtime state (do not edit) ---
variable_temps: []                  # rolling temperature samples
variable_powers: []                 # rolling PWM samples (0.0..1.0)
variable_running: 0                 # 1 while the delayed_gcode loop is active
gcode:
    # Namespace helper: call SOAK_MONITOR_SAMPLE for a single sample.
    SOAK_MONITOR_SAMPLE


# --------------------------------------------------------------------------
# Take one sample and append to the rolling buffers (trimmed to window size)
# --------------------------------------------------------------------------
[gcode_macro SOAK_MONITOR_SAMPLE]
gcode:
    {% set st = printer["gcode_macro SOAK_MONITOR"] %}
    {% set max_samples = (st.window_seconds / st.sample_period)|round(0, 'ceil')|int %}
    {% set t = printer.heater_bed.temperature|round(2) %}
    {% set p = printer.heater_bed.power|round(3) %}
    {% set temps  = (st.temps  + [t])[-max_samples:] %}
    {% set powers = (st.powers + [p])[-max_samples:] %}
    SET_GCODE_VARIABLE MACRO=SOAK_MONITOR VARIABLE=temps VALUE="{temps}"
    SET_GCODE_VARIABLE MACRO=SOAK_MONITOR VARIABLE=powers VALUE="{powers}"
    # Persist buffer + timestamp so it can survive a short reboot.
    SAVE_VARIABLE VARIABLE=soak_temps VALUE="{temps}"
    SAVE_VARIABLE VARIABLE=soak_powers VALUE="{powers}"
    SAVE_VARIABLE VARIABLE=soak_saved_at VALUE={printer.toolhead.estimated_print_time|round(1)}
    SAVE_VARIABLE VARIABLE=soak_uptime_marker VALUE={printer.webhooks.state == "ready"}


# --------------------------------------------------------------------------
# Sampling loop: re-arms itself every sample_period while running == 1
# --------------------------------------------------------------------------
[delayed_gcode soak_monitor_loop]
gcode:
    {% set st = printer["gcode_macro SOAK_MONITOR"] %}
    {% if st.running == 1 %}
        SOAK_MONITOR_SAMPLE
        UPDATE_DELAYED_GCODE ID=soak_monitor_loop DURATION={st.sample_period}
    {% endif %}


[gcode_macro SOAK_MONITOR_START]
description: Start the rolling bed heat-soak sampler
gcode:
    SET_GCODE_VARIABLE MACRO=SOAK_MONITOR VARIABLE=running VALUE=1
    UPDATE_DELAYED_GCODE ID=soak_monitor_loop DURATION={printer["gcode_macro SOAK_MONITOR"].sample_period}
    { action_respond_info("soak monitor: started") }


[gcode_macro SOAK_MONITOR_STOP]
description: Stop the sampler (call from cleanup / CANCEL_PRINT)
gcode:
    SET_GCODE_VARIABLE MACRO=SOAK_MONITOR VARIABLE=running VALUE=0
    UPDATE_DELAYED_GCODE ID=soak_monitor_loop DURATION=0
    { action_respond_info("soak monitor: stopped") }


# --------------------------------------------------------------------------
# Startup: restore pre-reboot history if it is fresh, else start clean.
# estimated_print_time resets to ~0 on every Klipper restart, so a saved
# timestamp that is GREATER than the current one means we are in a new session
# (i.e. a reboot happened). We only keep history when the reboot gap is short.
#
# NOTE: estimated_print_time is a monotonic clock that resets on restart; it
# cannot by itself measure wall-clock downtime. If your setup has an RTC or a
# host script that records real time, prefer that. With Klipper alone, the
# safe heuristic below keeps restored history only when the saved session
# clock had not advanced far past the freshly-restored one.
# --------------------------------------------------------------------------
[delayed_gcode soak_monitor_boot]
initial_duration: 2
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set saved_temps  = sv.soak_temps  if 'soak_temps'  in sv else [] %}
    {% set saved_powers = sv.soak_powers if 'soak_powers' in sv else [] %}
    {% set saved_at     = sv.soak_saved_at if 'soak_saved_at' in sv else 0 %}
    {% set now          = printer.toolhead.estimated_print_time|float %}
    {% set stale_limit  = printer["gcode_macro SOAK_MONITOR"].stale_after_seconds|float %}
    # After a reboot the clock restarts near 0. If the last save happened while
    # the clock was still small (recent boot) and we have data, treat it as
    # continuing the previous soak. Otherwise discard as stale/cold.
    {% if saved_temps|length > 0 and saved_at <= stale_limit %}
        SET_GCODE_VARIABLE MACRO=SOAK_MONITOR VARIABLE=temps VALUE="{saved_temps}"
        SET_GCODE_VARIABLE MACRO=SOAK_MONITOR VARIABLE=powers VALUE="{saved_powers}"
        { action_respond_info("soak monitor: restored %d pre-reboot samples" % saved_temps|length) }
    {% else %}
        SET_GCODE_VARIABLE MACRO=SOAK_MONITOR VARIABLE=temps VALUE="{[]}"
        SET_GCODE_VARIABLE MACRO=SOAK_MONITOR VARIABLE=powers VALUE="{[]}"
        SAVE_VARIABLE VARIABLE=soak_temps VALUE="{[]}"
        SAVE_VARIABLE VARIABLE=soak_powers VALUE="{[]}"
        { action_respond_info("soak monitor: no fresh history, starting clean") }
    {% endif %}
    SOAK_MONITOR_START


# --------------------------------------------------------------------------
# Report the 5-minute average + a soaked/not-soaked verdict.
# Compares the early vs late half of the window: if PWM has stopped falling
# and the bed is at target, the plate is thermally saturated.
# --------------------------------------------------------------------------
[gcode_macro SOAK_STATUS]
description: Report 5-minute bed temp/PWM average and soak verdict
variable_pwm_tolerance: 0.02        # <2% drift between halves = stable
variable_temp_band: 1.0             # degrees C below target still counts as "at temp"
gcode:
    {% set st = printer["gcode_macro SOAK_MONITOR"] %}
    {% set cfg = printer["gcode_macro SOAK_STATUS"] %}
    {% set temps = st.temps %}
    {% set powers = st.powers %}
    {% set n = temps|length %}
    {% set max_samples = (st.window_seconds / st.sample_period)|round(0, 'ceil')|int %}
    {% if n == 0 %}
        { action_respond_info("soak: no samples yet") }
    {% elif n < max_samples %}
        {% set t_avg = temps|sum / n %}
        {% set p_avg = powers|sum / n %}
        { action_respond_info("soak: warming up %ds/%ds -- avg %.2fC, pwm %.1f%%" % (
            n * st.sample_period, st.window_seconds, t_avg, p_avg * 100)) }
    {% else %}
        {% set half = (n / 2)|int %}
        {% set t_avg  = temps|sum / n %}
        {% set p_avg  = powers|sum / n %}
        {% set p_early = powers[:half]|sum / half %}
        {% set p_late  = powers[half:]|sum / (n - half) %}
        {% set target = printer.heater_bed.target %}
        {% set at_temp = temps|min >= (target - cfg.temp_band) and target > 0 %}
        {% set stable = (p_early - p_late)|abs < cfg.pwm_tolerance %}
        {% set soaked = at_temp and stable %}
        { action_respond_info(
            "soak (5min): avg %.2fC | pwm %.1f%% (early %.1f%% -> late %.1f%%) | at_temp=%s stable=%s | SOAKED=%s" % (
            t_avg, p_avg * 100, p_early * 100, p_late * 100, at_temp, stable, soaked)) }
    {% endif %}


# --------------------------------------------------------------------------
# One-shot instantaneous read (no buffer needed)
# --------------------------------------------------------------------------
[gcode_macro QUERY_BED_PWM]
description: Print current bed PWM duty cycle and temperature
gcode:
    { action_respond_info("bed: %.2fC / target %.2fC / pwm %.1f%%" % (
        printer.heater_bed.temperature,
        printer.heater_bed.target,
        printer.heater_bed.power * 100)) }
